<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RxPulse - Nursing Drug Reference</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 sm:p-8">
  <div class="max-w-2xl mx-auto">
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-slate-800">RxPulse</h1>
      <p class="text-slate-600 text-sm mt-1">Verified Clinical Nursing Pharmacology Reference</p>
    </header>

    <!-- Tab Navigation -->
    <div class="flex border-b border-slate-200 mb-6">
      <button onclick="switchTab('drug')" id="drugTabBtn" class="flex-1 py-3 text-sm font-semibold text-blue-600 border-b-2 border-blue-600 focus:outline-none transition">Single Drug Lookup</button>
      <button onclick="switchTab('class')" id="classTabBtn" class="flex-1 py-3 text-sm font-semibold text-slate-500 border-b-2 border-transparent hover:text-slate-700 focus:outline-none transition">Browse by Drug Class</button>
    </div>

    <!-- Drug Lookup View -->
    <div id="drugView" class="space-y-4">
      <div class="flex gap-2 mb-6">
        <input 
          type="text" 
          id="drugInput" 
          placeholder="Enter generic name (e.g., ampicillin, lisinopril)..." 
          onkeydown="if(event.key === 'Enter') searchDrug()"
          class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-sm"
        >
        <button 
          onclick="searchDrug()" 
          class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition shadow-sm text-sm"
        >
          Search
        </button>
      </div>
    </div>

    <!-- Class Browser View -->
    <div id="classView" class="space-y-4 hidden">
      <div class="flex gap-2 mb-6">
        <input 
          type="text" 
          id="classInput" 
          placeholder="Enter class keyword (e.g., antibiotic, statin)..." 
          onkeydown="if(event.key === 'Enter') searchClass()"
          class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white shadow-sm text-sm"
        >
        <button 
          onclick="searchClass()" 
          class="bg-blue-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-blue-700 transition shadow-sm text-sm"
        >
          Find Class
        </button>
      </div>
    </div>

    <div id="resultContainer" class="space-y-4"></div>
  </div>

  <!-- Modular Application Scripts -->
  <script src="firebase-config.js"></script>
  <script src="drug-engine.js"></script>
  <script src="ui.js"></script>
</body>
</html>
